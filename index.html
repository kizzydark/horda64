<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Horda 64</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--muted:#b7c0ee;--panel:#1a2052;--panel2:#252d6e;--line:#0b0f2a;--yellow:#ffcb05;--blue:#3d7dca;--red:#ff4d5e;--green:#4ade80;--gold:#ffd84a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0f1430;color:var(--ink);font-family:Nunito,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;display:block}
#fx{position:fixed;inset:0;pointer-events:none;z-index:2}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .15s;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(255,0,40,.55) 100%)}
.layer{position:fixed;inset:0;z-index:5;display:none}
.layer.on{display:flex}
.title{font-family:Bungee,Impact,sans-serif;letter-spacing:1px}
.outl{text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 4px 0 #000}
.btn{font:900 18px Nunito,sans-serif;color:#1b1b2e;background:var(--yellow);border:4px solid #000;border-radius:14px;padding:10px 18px;cursor:pointer;box-shadow:0 5px 0 #000;transition:transform .08s;outline:none}
.btn:hover,.btn.focus{transform:translateY(-3px);box-shadow:0 8px 0 #000;filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #000}
.btn.blue{background:#5aa0ff;color:#fff;text-shadow:0 2px 0 #000}
.btn.gray{background:#8a92b8;color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.disabled,.btn:disabled{opacity:.45;pointer-events:none}
.btn.on{background:#ff6a3a;color:#fff}
/* ---------- HUD */
#hud{flex-direction:column;pointer-events:none}
#xpbar{position:relative;height:16px;background:#0b0f2a;border-bottom:3px solid #000}
#xpfill{height:100%;width:0;background:linear-gradient(#7fd8ff,#3d7dca);transition:width .1s}
#lvl{position:absolute;right:8px;top:-1px;font:900 14px Nunito;text-shadow:0 2px 0 #000}
#hudTop{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;gap:8px}
#slots{display:flex;flex-direction:column;gap:4px;min-width:0}
.slotrow{display:flex;gap:4px;flex-wrap:wrap}
.slot{width:34px;height:34px;border-radius:9px;background:#141a44cc;border:3px solid #444c80;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.slot.leg{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.slot b{position:absolute;right:-3px;bottom:-5px;font:900 10px Nunito;background:#000;border-radius:6px;padding:0 3px;color:#fff}
#timerBox{display:flex;flex-direction:column;align-items:center;flex:1}
#coopBar{display:none;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);gap:8px;pointer-events:none}
body.coop #coopBar{display:flex}body.coop #hpBox,body.coop #slots{display:none}body.coop #objectives{top:64px;bottom:auto}
body.nettest #objectives{display:none}
body.netguest #slots,body.netguest #hpBox,body.netguest #combo{display:none!important}body.netguest #objectives{top:64px;bottom:auto}body.netguest #coopBar{display:flex}
#levelup.netcards{background:none;backdrop-filter:none;align-items:flex-end;justify-content:center;pointer-events:none;padding-bottom:96px}#levelup.netcards .panel{pointer-events:auto;background:rgba(10,14,40,.82);transform:scale(.7);transform-origin:bottom center;padding:8px 12px}#levelup.netcards .card{min-height:180px}
.netCode{font:clamp(28px,5vw,44px) Bungee,Impact;color:#fff;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}.netCode b{color:var(--yellow);letter-spacing:6px}
#netCode{font:22px Bungee,Impact;text-transform:uppercase;width:170px;padding:6px 10px;border-radius:8px;border:3px solid #000;letter-spacing:4px}
.cp{background:rgba(10,14,40,.82);border:3px solid #000;border-radius:10px;padding:5px 8px;min-width:150px;font:900 12px Nunito;text-shadow:0 1px 0 #000}
.cp .hb{height:7px;background:#5a0010;border:2px solid #000;border-radius:4px;margin:3px 0;overflow:hidden}.cp .hb i{display:block;height:100%;background:#4ade80}.cp .xb{height:3px;background:#223;border-radius:2px;overflow:hidden}.cp .xb i{display:block;height:100%;background:#7ad0ff}
.cp .mv{font-size:13px;letter-spacing:1px}.cp.down{opacity:.6}
@media (max-width:700px){.cp{min-width:0;padding:3px 5px;font-size:10px}}
.coopGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.coopSlot{padding:10px 6px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.coopSlot.empty{opacity:.6;border-style:dashed}
@media (max-width:700px){.coopGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
#stageTag{font:900 13px Nunito;letter-spacing:.5px;text-shadow:0 2px 0 #000;opacity:.95}
#timer.swarm{color:#ff4d5e}
#objectives{position:absolute;left:10px;top:118px;font:900 13px Nunito;text-shadow:0 2px 0 #000,0 0 3px #000;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:260px}
#objectives .done{opacity:.55;text-decoration:line-through}#objectives .hot{color:#ffd84a}#objectives .red{color:#ff6070}
@media (max-width:700px){#objectives{top:auto;bottom:70px;font-size:12px}}
#timer{font:28px Bungee,Impact;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
#bossBar{display:none;width:min(420px,60vw);margin-top:4px;text-align:center}
#bossName{font:900 14px Nunito;text-shadow:0 2px 0 #000;color:#ffb0b0}
.bb{height:12px;background:#300;border:3px solid #000;border-radius:8px;overflow:hidden}
#bossFill{height:100%;width:100%;background:linear-gradient(#ff7a7a,#d01030)}
#counters{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font:900 16px Nunito;text-shadow:0 2px 0 #000}
#hpBox{position:fixed;left:10px;bottom:10px;display:flex;flex-direction:column;gap:3px;min-width:200px}
#pname{font:900 15px Nunito;text-shadow:0 2px 0 #000}
.hpb{height:14px;background:#300;border:3px solid #000;border-radius:8px;overflow:hidden;width:220px}
#hpfill{height:100%;width:100%;background:linear-gradient(#7dff9a,#22b04a);transition:width .1s}
#hptext{font:800 12px Nunito;text-shadow:0 2px 0 #000;color:#e0ffe8}
/* ---------- Modais */
.modal{align-items:center;justify-content:center;background:rgba(8,10,30,.55);backdrop-filter:blur(2px);z-index:20}
.panel{background:var(--panel);border:4px solid #000;border-radius:20px;box-shadow:0 10px 0 #000;padding:18px 20px;max-width:min(980px,96vw);max-height:94vh;overflow:auto}
.panel h2{font:30px Bungee,Impact;text-align:center;color:var(--yellow);margin-bottom:12px}
#cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.card{width:210px;min-height:250px;background:#fffdf2;color:#1b1b2e;border:4px solid #000;border-radius:16px;box-shadow:0 6px 0 #000;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;transition:transform .1s;position:relative}
.card:hover,.card.focus{transform:translateY(-6px) rotate(-1deg);box-shadow:0 12px 0 #000}
.card .top{padding:8px 10px;color:#fff;font:900 13px Nunito;text-shadow:0 2px 0 #0008;display:flex;justify-content:space-between}
.card .ic{font-size:46px;text-align:center;margin:8px 0 2px}
.card .nm{font:17px Bungee,Impact;text-align:center;padding:0 6px;line-height:1.1}
.card .lv{text-align:center;font:900 13px Nunito;color:#4a4f80;margin:4px 0}
.card .ds{font:800 13px Nunito;padding:4px 12px 12px;text-align:center;color:#33365a}
.card .tag{position:absolute;top:34px;right:-6px;background:var(--red);color:#fff;font:900 12px Nunito;padding:2px 10px;border:3px solid #000;border-radius:8px;transform:rotate(8deg)}
.card.gold{background:linear-gradient(#fff6c0,#ffe070)}
.card.banish{outline:4px dashed var(--red)}
#luBtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.key{display:inline-block;background:#000;color:#fff;border-radius:5px;padding:0 5px;font-size:11px;margin-right:4px}
/* ---------- Transformação e banners */
#evo{align-items:flex-end;justify-content:center;pointer-events:none;z-index:15;padding-bottom:9vh}
#evoText{background:#fff;color:#111;border:5px solid #000;border-radius:14px;padding:14px 26px;font:900 clamp(18px,3vw,30px) Nunito;box-shadow:0 8px 0 #000;max-width:90vw;text-align:center}
#banner{position:fixed;left:50%;top:18%;transform:translate(-50%,-50%) scale(.6);z-index:12;pointer-events:none;opacity:0;transition:all .25s;font:clamp(20px,3.6vw,40px) Bungee,Impact;color:var(--yellow);text-align:center;width:92vw}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner small{display:block;font:900 clamp(13px,1.8vw,18px) Nunito;color:#fff}
/* ---------- Menu */
#menu{align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(ellipse at center,rgba(20,30,90,.2),rgba(5,8,25,.85));z-index:10}
.logo{font:clamp(42px,8vw,96px) Bungee,Impact;color:var(--yellow);line-height:.95;text-align:center;text-shadow:-4px -4px 0 #2a5ab0,4px -4px 0 #2a5ab0,-4px 4px 0 #2a5ab0,4px 4px 0 #2a5ab0,0 10px 0 #1a3a80,0 14px 0 #000;transform:rotate(-3deg)}
.logo64{display:inline-flex;gap:2px;margin-left:.18em;font-size:1.25em;vertical-align:-.12em;transform:rotate(4deg)}
.logo64 b{font-weight:400;color:#ff5a4a;text-shadow:-4px -4px 0 #7a1020,4px -4px 0 #7a1020,-4px 4px 0 #7a1020,4px 4px 0 #7a1020,0 10px 0 #4a0810,0 14px 0 #000}
.logo64 b+b{color:#46d870;text-shadow:-4px -4px 0 #0f5a2a,4px -4px 0 #0f5a2a,-4px 4px 0 #0f5a2a,4px 4px 0 #0f5a2a,0 10px 0 #083a18,0 14px 0 #000}
.sub{font:900 clamp(13px,2vw,18px) Nunito;color:#fff;text-shadow:0 2px 0 #000;text-align:center;opacity:.9}
.mbtns{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:260px}
.hint{font:800 13px Nunito;color:var(--muted);text-align:center;text-shadow:0 2px 0 #000}
#results .panel{text-align:center;min-width:min(520px,94vw)}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 18px;text-align:left;font:800 15px Nunito;margin:12px auto;max-width:380px}
.stats b{color:var(--yellow)}
#banner{text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,0 5px 0 #000}
#banner small{text-shadow:0 2px 0 #000,0 0 6px #000}
/* ---------- Menu e telas */
#menu{align-items:stretch;justify-content:flex-start;flex-direction:row;background:linear-gradient(90deg,rgba(6,9,30,.92) 0%,rgba(6,9,30,.75) 45%,rgba(6,9,30,0) 75%)}
#mcol{width:min(640px,100vw);height:100%;overflow-y:auto;padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px}
#menu.title{background:radial-gradient(ellipse at 50% 55%,rgba(4,6,20,0) 35%,rgba(4,6,20,.88) 100%)}
#menu.title #mcol{width:100%;align-items:center;justify-content:center;text-align:center}
.titleWrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;height:100%;padding-top:4vh}
.titleLogo{font-size:clamp(64px,13vw,150px);text-align:center}
.titleWrap .sub{font-size:clamp(14px,2vw,20px)}
.pressStart{margin-top:auto;background:none!important;border:none!important;box-shadow:none!important;font:clamp(22px,3.4vw,36px) Bungee,Impact!important;color:#fff!important;letter-spacing:3px;text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,0 0 18px #ffd84a;animation:blink 1.1s steps(2,start) infinite;transform:none!important}
@keyframes blink{50%{opacity:.12}}
.titleFoot{margin-top:18px;margin-bottom:6vh;font:800 12px Nunito;color:#9aa2d0;letter-spacing:1px;text-shadow:0 2px 0 #000}
.mmenu{display:flex;flex-direction:column;gap:2px;margin-top:14px;max-width:440px}
.mmenu .btn{background:none;border:none;box-shadow:none;border-radius:0;text-align:left;font:clamp(26px,4vw,40px) Bungee,Impact;color:#cfd6ff;padding:5px 26px 5px 36px;position:relative;letter-spacing:1px;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 4px 0 #000;transform:none;clip-path:polygon(0 0,100% 0,93% 100%,0 100%);transition:transform .12s,background .12s,color .12s}
.mmenu .btn small{font:900 14px Nunito;opacity:.85;margin-left:6px;letter-spacing:0;vertical-align:middle}
.mmenu .btn.focus,.mmenu .btn:hover{color:#1b1b2e;background:linear-gradient(90deg,#ffd84a,#ffb020 70%,rgba(255,176,32,.0));text-shadow:none;transform:translateX(10px);filter:none;box-shadow:none}
.mmenu .btn.focus::before{content:'▶';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.55em}
.mdesc{margin-top:auto;font:800 15px Nunito;color:#e8ecff;min-height:46px;border-left:4px solid var(--yellow);padding:7px 12px;background:rgba(0,0,0,.38);max-width:480px;text-shadow:0 1px 0 #000}
.hintbar{display:flex;gap:18px;font:900 13px Nunito;color:#c0c8f0;margin-top:8px;text-shadow:0 1px 0 #000}
.hintbar b{display:inline-block;min-width:22px;height:22px;border-radius:50%;background:#2a3170;border:2px solid #000;text-align:center;line-height:18px;color:#fff;margin-right:6px;font-size:12px}
#mcol h1{font:clamp(24px,4vw,36px) Bungee,Impact;color:var(--yellow);text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 4px 0 #000}
.coinsTag{font:900 18px Nunito;text-shadow:0 2px 0 #000}
.mainBtns{display:flex;flex-direction:column;gap:12px;max-width:330px;margin-top:6px}
.mainBtns .btn{text-align:left;font-size:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:#1c2460;border:3px solid #000;border-radius:12px;padding:6px;cursor:pointer;text-align:center;box-shadow:0 4px 0 #000;transition:transform .08s;position:relative}
.tile:hover,.tile.focus{transform:translateY(-3px);border-color:var(--yellow)}
.tile.sel{border-color:var(--yellow);background:#2c3a8a}
.gfxList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gfxItem{text-align:left;padding:8px 10px}.gfxItem img.gfxThumb{width:100%;height:auto;aspect-ratio:16/9;border-radius:6px;border:2px solid #000;margin:0 0 6px;image-rendering:pixelated}.gfxItem .tn{font-size:15px;margin-bottom:3px}
@media (max-width:560px){.gfxList{grid-template-columns:1fr}}
.tile img{width:72px;height:72px;display:block;margin:0 auto}
.tile .tn{font:900 12px Nunito;line-height:1.1}
.tile.locked{opacity:.85}
.tile .lk{position:absolute;top:4px;right:6px;font-size:14px}
.box{background:#141a48;border:3px solid #000;border-radius:14px;padding:12px 14px}
.box h3{font:20px Bungee,Impact;color:#fff;margin-bottom:4px}
.badge{display:inline-block;font:900 11px Nunito;padding:2px 8px;border-radius:8px;border:2px solid #000;color:#fff;text-shadow:0 1px 0 #000;margin-right:4px}
.sbar{display:grid;grid-template-columns:90px 1fr 46px;gap:6px;align-items:center;font:800 12px Nunito;margin:2px 0}
.sbar i{display:block;height:9px;background:#0a0e2a;border-radius:5px;overflow:hidden}
.sbar i b{display:block;height:100%;background:linear-gradient(90deg,#5aa0ff,#7dff9a)}
.muted{color:var(--muted);font:800 13px Nunito}
.maptile{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px}
.maptile .mi{font-size:38px;width:54px;text-align:center}
.shopItem{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;text-align:left;padding:8px 10px;cursor:default}
.shopItem .si{font-size:28px}
.pips{letter-spacing:2px;color:var(--yellow);font-size:12px}
.achItem{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;padding:8px 10px;cursor:default}
.achItem.done{border-color:#4ade80}
.opt{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font:800 15px Nunito;margin:8px 0}
input[type=range]{width:100%}
#pause .panel,#chest .panel{min-width:min(560px,94vw);text-align:center}
.slist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.chip{background:#141a48;border:3px solid #000;border-radius:10px;padding:4px 8px;font:800 13px Nunito}
.chip.leg{border-color:var(--gold)}
.loot{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.loot div{background:#fffdf2;color:#1b1b2e;border:4px solid #000;border-radius:12px;padding:8px 12px;font:900 16px Nunito;animation:pop .35s both}
.loot div.leg{background:linear-gradient(#fff6c0,#ffd84a)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.bigball{font-size:64px;animation:shake .5s 2}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
#toasts{position:fixed;right:10px;top:70px;z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#fff;color:#111;border:4px solid #000;border-radius:12px;padding:8px 12px;font:900 14px Nunito;box-shadow:0 5px 0 #000;animation:pop .3s both;max-width:300px}
.toast small{display:block;font-weight:800;color:#4a4f80}
body.glitch #gl{animation:glt .35s steps(2) infinite}
@keyframes glt{0%{filter:hue-rotate(0) contrast(1)}50%{filter:hue-rotate(160deg) contrast(1.6) saturate(2)}100%{filter:hue-rotate(300deg) invert(.1)}}
#glitch{position:fixed;inset:0;pointer-events:none;z-index:4;display:none;background:repeating-linear-gradient(0deg,rgba(255,0,255,.08) 0 2px,rgba(0,0,0,0) 2px 5px)}
body.glitch #glitch{display:block}
@media (max-width:700px){#menu{background:rgba(6,9,30,.82)} .card{width:44vw;min-height:200px} .card .ic{font-size:34px} #hpBox{min-width:0} .hpb{width:150px}}
#combo{font:30px Bungee,Impact;color:#ffd84a;text-shadow:-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000,0 4px 0 #000;margin-top:2px;opacity:0;transition:opacity .2s;pointer-events:none;line-height:1}
#combo.on{opacity:1}
#combo small{display:block;font:900 12px Nunito;color:#fff;letter-spacing:2px}
#combo.bump{animation:bump .18s}
@keyframes bump{0%{transform:scale(1.35) rotate(-4deg)}100%{transform:scale(1)}}
#xpbar.gain #xpfill{filter:brightness(1.6) drop-shadow(0 0 6px #7fd8ff)}
.card{animation:cardIn .38s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{transform:translateY(60px) scale(.6) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.card.rare{box-shadow:0 6px 0 #000,0 0 22px #ffd84a}
.loot .roll{background:#2a2f6a;color:#fff;border-color:#000}
.loot .roll.done{background:#fffdf2;color:#1b1b2e;animation:pop .3s both}
.loot .roll.leg.done{background:linear-gradient(90deg,#ffe070,#fff6c0,#ffb0f0,#a0e0ff,#ffe070);background-size:300% 100%;animation:pop .3s both,shine 1.2s linear infinite}
@keyframes shine{to{background-position:300% 0}}
#dbg{position:fixed;right:8px;bottom:8px;z-index:30;font:800 11px monospace;color:#9f9;background:#000a;padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="vignette"></div>

<div id="hud" class="layer">
  <div id="xpbar"><div id="xpfill"></div><span id="lvl">Nv 1</span></div>
  <div id="hudTop">
    <div id="slots"><div id="moveSlots" class="slotrow"></div><div id="itemSlots" class="slotrow"></div></div>
    <div id="timerBox"><div id="stageTag"></div><div id="timer">00:00</div>
      <div id="bossBar"><div id="bossName"></div><div class="bb"><div id="bossFill"></div></div></div><div id="combo"></div></div>
    <div id="counters"><div>💀 <span id="kills">0</span></div><div>🪙 <span id="coins">0</span></div></div>
  </div>
  <div id="objectives"></div>
  <div id="coopBar"></div>

   bossOf: qual chefe da lista `bosses` do mapa vira o chefe do portal em cada fase (0 = primeiro).          */

  diff: [1, 1.25, 1.5],        // HP dos inimigos por fase (além do crescimento normal por minuto)
  bossOf: [0, 2, 3],           // fase 1: 1º chefe do mapa • fase 2: 3º • fase 3: o lendário (último)
  bossHp: [2.5, 1.3, 1],       // vida extra do chefe do portal em cada fase
  challengeBoss: 1,            // a Pedra do Desafio chama o 2º chefe da lista do mapa

  bank: 0.2,                   // fim da partida: 20% do ouro que sobrou vai para o Mercado...

  else if (sm && !sm.def.legendary && sm.lvl < sm.def.levels.length) sm.lvl++;

  $('evoText').textContent = msg;

/* ------------------------------------------------------------ MÚSICA (chiptune procedural, original) */
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], phryg: [0, 1, 3, 5, 7, 8, 10] };
const MUS = { song: null, step: 0, next: 0, timer: null, boss: false, cfg: null };
const MENU_SONG = { seed: 5, tempo: 112, root: 60, mode: 'major', prog: [0, 3, 4, 0] };
function makeSong(cfg) {
  const r = mulberry(cfg.seed || 1); const sc = SCALES[cfg.mode] || SCALES.major; const root = cfg.root || 60; const prog = cfg.prog || [0, 5, 3, 4];
  const semi = (d) => sc[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
  const mA = [], mB = []; for (let s = 0; s < 16; s++) { mA.push(r() < 0.6 ? (r() * 6) | 0 : -1); mB.push(r() < 0.55 ? (r() * 6) | 0 : -1); } mA[0] = 0; mB[0] = 2;
  const lead = [], bass = [], arp = []; const bars = prog.length * 2; const ct = [0, 2, 4, 7, 4, 2];
  for (let b = 0; b < bars; b++) {
    const deg = prog[b % prog.length]; const mot = b >= prog.length ? mB : mA;
    for (let s = 0; s < 16; s++) {
      const mi = mot[s]; lead.push(mi >= 0 ? root + 12 + semi(deg + ct[mi]) : -1);
      bass.push(s % 4 === 0 ? root - 24 + semi(deg) + (s % 8 === 4 ? 12 : 0) : -1);
      arp.push(s % 2 === 0 ? root + semi(deg + [0, 2, 4, 2][(s / 2) % 4]) : -1);
    }
  }
  return { tempo: cfg.tempo || 130, lead, bass, arp, len: bars * 16 };
}
function musicStart(cfg) { if (!AU.ctx) return; musicStop(); MUS.cfg = cfg; MUS.song = makeSong(cfg); MUS.step = 0; MUS.next = AU.ctx.currentTime + 0.1; MUS.timer = setInterval(musicTick, 25); }
function musicStop() { if (MUS.timer) clearInterval(MUS.timer); MUS.timer = null; MUS.song = null; MUS.boss = false; }
function musicBoss(on) { MUS.boss = on; }
function musicTick() {
  const ctx = AU.ctx, sg = MUS.song; if (!ctx || !sg) return;
  const stepLen = 60 / (sg.tempo * (MUS.boss ? 1.15 : 1)) / 4; const fq = (m) => 440 * Math.pow(2, (m - 69) / 12);
  if (MUS.next < ctx.currentTime - 0.3) MUS.next = ctx.currentTime + 0.05;
  while (MUS.next < ctx.currentTime + 0.12) {
    const s = MUS.step % sg.len, t = Math.max(0, MUS.next - ctx.currentTime), ss = s % 16;
    if (sg.lead[s] >= 0) tone({ type: 'square', f: fq(sg.lead[s] + (MUS.boss ? -12 : 0)), dur: stepLen * 1.6, vol: 0.04, delay: t, dest: AU.music });
    if (sg.bass[s] >= 0) tone({ type: 'triangle', f: fq(sg.bass[s]), dur: stepLen * 1.8, vol: 0.13, delay: t, dest: AU.music });
    if (sg.arp[s] >= 0) tone({ type: 'square', f: fq(sg.arp[s]), dur: stepLen * 0.5, vol: 0.016, delay: t, dest: AU.music });
    if (ss % 8 === 0 || (MUS.boss && ss % 4 === 0)) tone({ type: 'sine', f: 150, f2: 40, dur: 0.12, vol: 0.2, delay: t, dest: AU.music });
    if (ss % 8 === 4) noise({ f: 3000, dur: 0.08, vol: 0.07, delay: t, dest: AU.music });
    if (ss % 2 === 0 || MUS.boss || MUS.intense) noise({ ft: 'highpass', f: 7000, dur: 0.03, vol: 0.025, delay: t, dest: AU.music });
    if (MUS.intense && ss % 4 === 2) tone({ type: 'sine', f: 120, f2: 45, dur: 0.1, vol: 0.12, delay: t, dest: AU.music });
    MUS.next += stepLen; MUS.step++;
  }
}
function musicDuck(on) { if (AU.music) AU.music.gain.value = on ? SAVE.opts.music * 0.15 : SAVE.opts.music; }
